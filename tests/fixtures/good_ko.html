<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>한빛정밀 견적 자동화</title>
<meta name="description" content="견적서 작성 시간을 주 4시간에서 15분으로 줄입니다.">
<meta property="og:image" content="https://example.kr/og.png">
<meta property="og:locale" content="ko_KR">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  html { word-break: keep-all; overflow-wrap: break-word; font-synthesis: none;
         font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif; }
  :root { --ink: #191817; --head: #52504d; --plane: #fcfaee; --line: #e5e5e5; --white: #ffffff; --num: #060daa; }
  h1 { color: #52504d; font-size: 48px; }
  .cta { background: #191817; color: #ffffff; padding: 8px 12px; border-radius: 10px;
         transition: transform 500ms cubic-bezier(0.22,1,0.36,1), opacity 300ms cubic-bezier(0.22,1,0.36,1); }
  .card { border: 1px solid #e5e5e5; border-radius: 20px; padding: 24px; }
  @media (prefers-reduced-motion: reduce) { .cta { transition: opacity 300ms cubic-bezier(0.22,1,0.36,1); } }
</style>
</head>
<body>
<a href="#main">본문 바로가기</a>
<main id="main">
  <section>
    <h1>견적서 작성, 주 4시간에서<br>15분으로 줄입니다</h1>
    <p>도면을 올리면 자재와 공정별 단가를 계산해 견적서 초안을 만들어 드립니다.</p>
    <a class="cta" href="/signup">무료로 시작하기</a>
  </section>
  <form action="/lead">
    <input type="email" name="email" required>
    <label><input type="checkbox" required> 개인정보 수집 및 이용에 동의합니다 (항목: 이메일, 목적: 상담 안내, 보유기간: 1년, 거부 시 상담 불가)</label>
    <label><input type="checkbox"> 마케팅 정보 수신에 동의합니다 (선택)</label>
    <button type="submit">상담 예약하기</button>
  </form>
</main>
<footer>
  <a href="/privacy"><strong>개인정보처리방침</strong></a> <a href="/terms">이용약관</a>
  <p>상호 한빛정밀 · 대표 조은솔 · 사업자등록번호 123-45-67890</p>
</footer>
</body>
</html>
